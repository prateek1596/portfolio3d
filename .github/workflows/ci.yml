name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --port 5173 &

      - name: Wait for server
        run: npx wait-on http://localhost:5173

      - name: Run Lighthouse
        run: |
          npx lighthouse http://localhost:5173 --quiet --chrome-flags="--no-sandbox --headless" --only-categories=performance,accessibility,seo,best-practices --output html --output-path ./lighthouse-report.html || true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./lighthouse-report.html
